name: Daily node scrape

on:
  schedule:
    # 每天 UTC 0 点运行 = 北京时间早上 8 点
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许在 Actions 页面手动点 Run

permissions:
  contents: write  # 允许把抓取结果 commit 回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape nodes
        run: python3 scraper.py

      - name: Rename, group & build config
        run: python3 geoip_rename.py --limit 400

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/clash.yaml output/nodes.txt output/subscription.txt output/report.txt geoip_cache.json
          git diff --cached --quiet || git commit -m "daily scrape $(date -u +%Y-%m-%d)"
          git push
