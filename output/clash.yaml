  include-all-proxies: true
  filter: ^(AD|AL|AT|AX|BA|BE|BG|BY|CH|CY|CZ|DE|DK|EE|ES|FI|FR|GB|GI|GR|HR|HU|IE|IM|IS|IT|LI|LT|LU|LV|MC|MD|ME|MK|MT|NL|NO|PL|PT|RO|RS|RU|SE|SI|SK|SM|UA|VA)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 非洲
  type: url-test
  include-all-proxies: true
  filter: ^(AO|BF|BI|BJ|BW|CD|CF|CG|CI|CM|CV|DJ|DZ|EG|EH|ER|ET|GA|GH|GM|GN|GQ|GW|KE|KM|LR|LS|LY|MA|MG|ML|MR|MU|MW|MZ|NA|NE|NG|RW|SC|SD|SL|SN|SO|SS|ST|SZ|TD|TG|TN|TZ|UG|ZA|ZM|ZW)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 美洲
  type: url-test
  include-all-proxies: true
  filter: ^(AG|AR|AW|BB|BM|BO|BQ|BR|BS|BZ|CA|CL|CO|CR|CU|CW|DM|DO|EC|FK|GD|GL|GP|GT|GY|HN|HT|JM|KN|LC|MQ|MX|NI|PA|PE|PR|PY|SR|SV|TT|UY|VC|VE)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 大洋洲
  type: url-test
  include-all-proxies: true
  filter: ^(AU|CK|FJ|FM|GU|KI|MH|NC|NR|NU|NZ|PF|PG|PW|SB|TK|TO|TV|VU|WF|WS)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
