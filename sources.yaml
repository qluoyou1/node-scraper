# 抓取来源配置
# 网页/订阅 URL 支持日期模板：
#   {today:%Y%m%d}  -> 20261005
#   {today:%Y/%m/%d} -> 2026/10/05
#   {today_nopad}   -> 2026-10-5（无前导零）
# 含日期模板的 URL 会自动按今天、昨天、前天依次尝试，直到成功。

web_pages:
  # clashgithub 每日节点页（日期模板）
  - "https://clashgithub.com/clashnode-{today:%Y%m%d}.html"
  # clashnodev2ray 每日节点页（日期模板）
  - "https://clashnodev2ray.github.io/{today:%Y/%m/%d}/free-ssr-node/"
  # freenodess 每日节点页（无前导零日期模板）
  - "https://freenodess.github.io/freenode/posts/{today_nopad}-freenode/"

subscriptions:
  # # clashgithub 每日 v2ray 订阅（base64）
  # - "https://clashgithub.com/wp-content/uploads/rss/{today:%Y%m%d}.txt"
  # # clashgithub 每日 clash 订阅（YAML）
  # - "https://clashgithub.com/wp-content/uploads/rss/{today:%Y%m%d}.yml"
  # # free18/v2ray GitHub 仓库订阅
  # - "https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/v.txt"
  # - "https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/c.yaml"
  # Barabama/FreeNodes：yudou 分享节点（txt 为 URI 列表，yaml 为 Clash 格式）
  - "https://fastly.jsdelivr.net/gh/Barabama/FreeNodes@feat/ai-crawler-v2/nodes/yudou.txt"
  - "https://fastly.jsdelivr.net/gh/Barabama/FreeNodes@feat/ai-crawler-v2/nodes/yudou.yaml"
  # ===== 优先来源：实测可用节点，更新频繁 =====
  # Au1rxx/free-vpn-subscriptions：每小时更新，HTTP 实测可用；分国家订阅补常用地区
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-JP.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-US.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-SG.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-KR.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-HK.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/by-country/clash-TW.yaml"
  - "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
  # igareck/vpn-configs-for-russia：大量欧洲节点（明文 URI 列表，每日更新）
  - "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt"
  - "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt"
  - "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS+All_RUS.txt"
  - "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS_WEAK_DPI_RUS.txt"
  - "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt"

# Telegram 公开频道（通过 t.me/s/<频道> 免登录预览抓取）
# 脚本会提取消息中的节点 URI，并对消息里的节点发布页链接跟进抓取一层
tg_channels:
  - clashjd
  - pgkj666
  - afxdxqe
